<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>逗逗你的呀😂</title>
<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;color-scheme:light;
     background:radial-gradient(1000px 560px at 50% 34%,#253145,#10151d 72%);
     font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
.big{font-size:clamp(32px,8.5vw,104px);font-weight:900;letter-spacing:.04em;color:#ffd76a;
     text-align:center;padding:0 22px;text-shadow:0 2px 0 #7a4a00,0 10px 34px rgba(255,180,60,.35);
     animation:eggfloat 3s ease-in-out infinite}
@keyframes eggfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
</style>
</head>
<body>
<div class="big">逗逗你的呀😂</div>
</body>
</html>
